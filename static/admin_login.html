<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ ACESSO RESTRITO - Clash Genius</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Fira+Code:wght@400;500&display=swap');
        body.admin-page {
            background: #050508;
            overflow: hidden;
        }
        .lightning-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .lightning-bolt {
            position: absolute;
            width: 3px;
            background: linear-gradient(180deg, rgba(0, 200, 255, 0.9), rgba(100, 0, 255, 0.3));
            filter: blur(1px);
            opacity: 0;
            animation: lightning-flash 4s infinite;
        }
        .lightning-bolt:nth-child(1) { left: 15%; height: 40%; top: 0; animation-delay: 0.5s; }
        .lightning-bolt:nth-child(2) { left: 45%; height: 60%; top: 0; animation-delay: 2.1s; width: 2px; }
        .lightning-bolt:nth-child(3) { left: 75%; height: 35%; top: 10%; animation-delay: 3.5s; }
        .lightning-bolt:nth-child(4) { left: 30%; height: 50%; top: 0; animation-delay: 1.2s; width: 2px; }
        .lightning-bolt:nth-child(5) { left: 60%; height: 45%; top: 5%; animation-delay: 2.8s; }
        @keyframes lightning-flash {
            0%, 100% { opacity: 0; }
            2% { opacity: 0.8; box-shadow: 0 0 20px rgba(0, 200, 255, 0.5), 0 0 40px rgba(0, 200, 255, 0.3); }
            3% { opacity: 0.2; }
            4% { opacity: 0.7; box-shadow: 0 0 30px rgba(0, 200, 255, 0.6), 0 0 60px rgba(0, 200, 255, 0.4); }
            5% { opacity: 0; }
            10% { opacity: 0; }
        }
        .fire-overlay {
            position: fixed; bottom: 0; left: 0;
            width: 100%; height: 40%;
            background: radial-gradient(ellipse at 20% 100%, rgba(255, 100, 0, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 100%, rgba(255, 0, 0, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 100%, rgba(255, 100, 0, 0.15) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
            animation: fire-flicker 3s ease-in-out infinite;
        }
        @keyframes fire-flicker {
            0%, 100% { opacity: 0.6; }
            25% { opacity: 0.8; }
            50% { opacity: 0.5; }
            75% { opacity: 0.9; }
        }
        .fire-particles {
            position: fixed; bottom: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .fire-particle {
            position: absolute; bottom: 0; width: 4px; height: 4px;
            background: var(--neon-orange); border-radius: 50%;
            animation: fire-rise 3s infinite; opacity: 0;
        }
        .fire-particle:nth-child(1) { left: 10%; animation-delay: 0.2s; }
        .fire-particle:nth-child(2) { left: 20%; animation-delay: 1.1s; height: 6px; width: 6px; }
        .fire-particle:nth-child(3) { left: 35%; animation-delay: 0.7s; }
        .fire-particle:nth-child(4) { left: 45%; animation-delay: 1.8s; height: 5px; width: 5px; background: var(--neon-yellow); }
        .fire-particle:nth-child(5) { left: 55%; animation-delay: 0.4s; }
        .fire-particle:nth-child(6) { left: 65%; animation-delay: 2.0s; height: 3px; width: 3px; }
        .fire-particle:nth-child(7) { left: 75%; animation-delay: 1.4s; background: var(--neon-red); }
        .fire-particle:nth-child(8) { left: 85%; animation-delay: 0.9s; }
        .fire-particle:nth-child(9) { left: 50%; animation-delay: 2.5s; height: 7px; width: 7px; }
        .fire-particle:nth-child(10) { left: 30%; animation-delay: 0.1s; background: var(--neon-yellow); }
        @keyframes fire-rise {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            20% { opacity: 0.9; }
            100% { transform: translateY(-300px) scale(2); opacity: 0; }
        }
        .login-container { position: relative; z-index: 2; }
        .login-card {
            background: rgba(10, 10, 20, 0.95) !important;
            border: 2px solid rgba(255, 0, 64, 0.3) !important;
            box-shadow: 0 0 40px rgba(255, 0, 64, 0.15), 0 0 80px rgba(255, 0, 0, 0.05) !important;
            position: relative; overflow: hidden;
        }
        .login-card::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--neon-red), var(--neon-purple), var(--neon-cyan), var(--neon-red));
            background-size: 400% 400%; z-index: -1;
            animation: border-dance 6s linear infinite; border-radius: var(--border-radius-base);
        }
        @keyframes border-dance {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .login-card h2 {
            color: var(--neon-red) !important;
            text-shadow: 0 0 15px rgba(255, 0, 64, 0.5), 0 0 30px rgba(255, 0, 0, 0.3) !important;
            font-family: 'Orbitron', sans-serif !important;
            font-weight: 900 !important;
            letter-spacing: 4px;
            margin-top: 25px !important;
        }
        .login-card p { color: rgba(255, 200, 200, 0.6) !important; }
        .login-card input[type="text"], .login-card input[type="password"] {
            background: rgba(0, 0, 0, 0.8) !important;
            border: 1px solid rgba(255, 0, 64, 0.3) !important;
            color: #ff4444 !important;
            font-family: 'Fira Code', monospace !important;
        }
        .login-card input:focus {
            border-color: var(--neon-red) !important;
            box-shadow: 0 0 20px rgba(255, 0, 64, 0.3) !important;
        }
        .login-card button {
            background: linear-gradient(135deg, #cc0033, var(--neon-red), #ff0040) !important;
            border: 1px solid rgba(255, 0, 64, 0.5) !important;
            box-shadow: 0 0 20px rgba(255, 0, 64, 0.3) !important;
            font-family: 'Orbitron', sans-serif !important;
            letter-spacing: 3px;
            font-weight: 700 !important;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .login-card button:hover {
            box-shadow: 0 0 40px rgba(255, 0, 64, 0.6) !important;
            transform: scale(1.02);
        }
        .login-badge {
            filter: drop-shadow(0 0 20px rgba(255, 0, 64, 0.3));
            animation: badge-rotate 10s linear infinite;
        }
        @keyframes badge-rotate {
            0% { filter: drop-shadow(0 0 20px rgba(255, 0, 64, 0.3)) hue-rotate(0deg); }
            50% { filter: drop-shadow(0 0 30px rgba(255, 0, 0, 0.5)) hue-rotate(20deg); }
            100% { filter: drop-shadow(0 0 20px rgba(255, 0, 64, 0.3)) hue-rotate(0deg); }
        }
        .login-card .register-link {
            color: rgba(255, 200, 200, 0.5);
            font-family: 'Fira Code', monospace;
            font-size: 0.8em;
            cursor: pointer;
            transition: color 0.3s;
        }
        .login-card .register-link:hover { color: var(--neon-cyan); }
        .login-card .register-link i { color: var(--neon-cyan); }
        .login-card .register-form { display: none; }
        .login-card .register-form.active { display: block; }
        .login-card .login-form.hidden { display: none; }
        #register-feedback, #login-feedback {
            font-family: 'Fira Code', monospace;
            font-size: 0.8em;
            margin-top: 10px;
        }
        .warning-stripes {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255, 0, 0, 0.02) 20px, rgba(255, 0, 0, 0.02) 40px);
            pointer-events: none; z-index: 0;
        }
    </style>
</head>
<body class="admin-page">
    <div class="lightning-container">
        <div class="lightning-bolt" style="left: 10%; animation-delay: 0.3s;"></div>
        <div class="lightning-bolt" style="left: 25%; height: 55%; animation-delay: 1.8s; width: 2px;"></div>
        <div class="lightning-bolt" style="left: 40%; height: 30%; animation-delay: 3.2s;"></div>
        <div class="lightning-bolt" style="left: 55%; height: 65%; animation-delay: 0.9s; width: 2px;"></div>
        <div class="lightning-bolt" style="left: 70%; height: 38%; animation-delay: 2.6s;"></div>
        <div class="lightning-bolt" style="left: 85%; height: 50%; animation-delay: 4.0s;"></div>
        <div class="lightning-bolt" style="left: 35%; height: 42%; animation-delay: 0.6s;"></div>
        <div class="lightning-bolt" style="left: 65%; height: 58%; animation-delay: 1.4s; width: 2px;"></div>
    </div>
    <div class="warning-stripes"></div>
    <div class="fire-overlay"></div>
    <div class="fire-particles">
        <div class="fire-particle"></div><div class="fire-particle"></div>
        <div class="fire-particle"></div><div class="fire-particle"></div>
        <div class="fire-particle"></div><div class="fire-particle"></div>
        <div class="fire-particle"></div><div class="fire-particle"></div>
        <div class="fire-particle"></div><div class="fire-particle"></div>
        <div class="fire-particle"></div><div class="fire-particle"></div>
        <div class="fire-particle"></div><div class="fire-particle"></div>
        <div class="fire-particle"></div>
    </div>
    <canvas id="particle-background"></canvas>
    <div class="login-container">
        <div class="login-card">
            <img src="/static/images/default_badge.png" alt="Emblema" class="login-badge">
            <h2>ACESSO RESTRITO</h2>
            <p style="font-family: 'Fira Code', monospace; font-size: 0.85em;">>> AUTENTICAÇÃO NECESSÁRIA <<</p>
            
            <!-- Login Form -->
            <div id="login-form-section" class="login-form">
                <input type="text" id="login-username" placeholder="// USUÁRIO //" style="width:80%;padding:10px;margin-bottom:10px;background:rgba(0,0,0,0.8);border:1px solid rgba(255,0,64,0.3);color:#ff4444;font-family:'Fira Code',monospace;text-align:center;" required>
                <input type="password" id="login-password" placeholder="// SENHA //" style="width:80%;padding:10px;margin-bottom:10px;background:rgba(0,0,0,0.8);border:1px solid rgba(255,0,64,0.3);color:#ff4444;font-family:'Fira Code',monospace;text-align:center;" required>
                <input type="hidden" id="login-guild-id" value="">
                <button onclick="doLogin()">▶ ACESSAR</button>
                <p id="login-feedback" style="color:#ff6b6b;"></p>
                <p class="register-link" onclick="showRegister()"> <i>🔑</i> Não tem acesso? Solicite sua conta</p>
            </div>

            <!-- Register Form -->
            <div id="register-form-section" class="register-form">
                <h3 style="color:var(--neon-cyan);font-size:1em;margin:15px 0;">SOLICITAR ACESSO</h3>
                <input type="text" id="reg-username" placeholder="// USUÁRIO DESEJADO //" style="width:80%;padding:10px;margin-bottom:10px;background:rgba(0,0,0,0.8);border:1px solid rgba(0,255,249,0.3);color:#00ffcc;font-family:'Fira Code',monospace;text-align:center;" required>
                <input type="password" id="reg-password" placeholder="// SENHA //" style="width:80%;padding:10px;margin-bottom:10px;background:rgba(0,0,0,0.8);border:1px solid rgba(0,255,249,0.3);color:#00ffcc;font-family:'Fira Code',monospace;text-align:center;" required>
                <input type="text" id="reg-discord" placeholder="// SEU DISCORD (ex: usuario#1234) //" style="width:80%;padding:10px;margin-bottom:10px;background:rgba(0,0,0,0.8);border:1px solid rgba(0,255,249,0.3);color:#00ffcc;font-family:'Fira Code',monospace;text-align:center;">
                <button onclick="doRegister()" style="background:linear-gradient(135deg,#0033cc,var(--neon-cyan),#0040ff)!important;">▶ SOLICITAR</button>
                <p id="register-feedback" style="color:#00ffcc;"></p>
                <p class="register-link" onclick="showLogin()"><i>⬅</i> Voltar ao login</p>
            </div>

            <p id="master-password-fallback" style="font-size:0.7em;margin-top:15px;color:rgba(255,255,255,0.2);cursor:pointer;" onclick="useMasterPassword()">[senha mestra]</p>
        </div>
    </div>

    <!-- Master Password Form (hidden, shown by useMasterPassword) -->
    <div id="master-password-section" style="display:none;position:relative;z-index:2;">
        <div class="login-card" style="margin-top:20px;">
            <h2 style="font-size:1.2em;">🔐 SENHA MESTRA</h2>
            <form action="/admin/login" method="POST" style="padding:20px;">
                <input type="hidden" name="guild_id" id="mp-guild-id" value="">
                <input type="password" name="password" placeholder="// SENHA MESTRA //" style="width:80%;padding:12px;margin-bottom:12px;background:rgba(0,0,0,0.8);border:1px solid rgba(255,0,64,0.3);color:#ff4444;font-family:'Fira Code',monospace;text-align:center;font-size:1.1em;" required autofocus>
                <button type="submit">▶ ACESSAR</button>
            </form>
            <p class="register-link" onclick="location.reload()" style="color:rgba(255,200,200,0.5);font-family:'Fira Code',monospace;font-size:0.8em;cursor:pointer;padding-bottom:15px;"><i>⬅</i> Voltar</p>
        </div>
    </div>
    <script>
        // Efeito de partículas (copiado do admin.js) 
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('particle-background');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                class Particle { constructor() { this.reset(); }
                    reset() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2 + 0.5; this.speedX = (Math.random() - 0.5) * 0.3; this.speedY = (Math.random() - 0.5) * 0.3; this.opacity = Math.random() * 0.5 + 0.1; }
                    update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset(); }
                    draw() { ctx.fillStyle = `rgba(0, 200, 255, ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); } }
                const particles = Array.from({length: 80}, () => new Particle());
                function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
                animate();
            }
            const urlParams = new URLSearchParams(window.location.search);
            const guildId = urlParams.get('guild_id');
            if (guildId) document.getElementById('login-guild-id').value = guildId;
            if (urlParams.has('error')) document.getElementById('login-feedback').textContent = '⚠️ ACESSO NEGADO: Senha incorreta.';
        });

        function showRegister() {
            document.getElementById('login-form-section').style.display = 'none';
            document.getElementById('register-form-section').classList.add('active');
            document.getElementById('register-form-section').style.display = 'block';
        }
        function showLogin() {
            document.getElementById('register-form-section').style.display = 'none';
            document.getElementById('login-form-section').style.display = 'block';
        }

        async function doLogin() {
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;
            const guildId = document.getElementById('login-guild-id').value;
            const fb = document.getElementById('login-feedback');
            if (!username || !password) { fb.textContent = '⚠️ Preencha usuário e senha.'; return; }
            fb.textContent = '⏳ Autenticando...';
            try {
                const resp = await fetch('/api/admin/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password, guild_id: guildId})
                });
                const data = await resp.json();
                if (data.status === 'success') {
                    window.location.href = '/admin/panel';
                } else {
                    fb.textContent = '⚠️ ' + (data.message || 'Falha na autenticação.');
                }
            } catch(e) {
                fb.textContent = '⚠️ Erro de conexão com o servidor.';
            }
        }

        async function doRegister() {
            const username = document.getElementById('reg-username').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            const discord = document.getElementById('reg-discord').value.trim();
            const fb = document.getElementById('register-feedback');
            if (!username || !password) { fb.textContent = '⚠️ Preencha usuário e senha.'; return; }
            if (username.length < 3) { fb.textContent = '⚠️ Usuário deve ter no mínimo 3 caracteres.'; return; }
            if (password.length < 4) { fb.textContent = '⚠️ Senha deve ter no mínimo 4 caracteres.'; return; }
            fb.textContent = '⏳ Enviando solicitação...';
            try {
                const resp = await fetch('/api/admin/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password, discord})
                });
                const data = await resp.json();
                fb.textContent = data.status === 'success' ? '✅ ' + data.message : '⚠️ ' + (data.message || 'Erro ao solicitar.');
                if (data.status === 'success') {
                    document.getElementById('reg-username').value = '';
                    document.getElementById('reg-password').value = '';
                    document.getElementById('reg-discord').value = '';
                }
            } catch(e) {
                fb.textContent = '⚠️ Erro de conexão com o servidor.';
            }
        }

        function useMasterPassword() {
            document.getElementById('login-form-section').style.display = 'none';
            document.getElementById('register-form-section').style.display = 'none';
            document.querySelector('.login-card').style.display = 'none';
            document.getElementById('master-password-section').style.display = 'block';
            document.getElementById('mp-guild-id').value = document.getElementById('login-guild-id').value;
            setTimeout(() => document.querySelector('#master-password-section input[type="password"]').focus(), 100);
        }
    </script>
</body>
</html>
