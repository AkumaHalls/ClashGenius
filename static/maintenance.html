<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Manutenção - Clash Genius</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="maintenance-page">
    <div class="maintenance-container">
        <div class="gear-container">
            <div class="gear-icon gear-one">⚙️</div>
            <div class="gear-icon gear-two">⚙️</div>
        </div>
        <h1>Em Manutenção</h1>
        <p id="maintenance-custom-message">O painel do Clash Genius está passando por uma breve manutenção. Voltaremos em breve!</p>
    </div>
    <script>
        // Script para buscar e exibir a mensagem de manutenção personalizada
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/maintenance_message')
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        document.getElementById('maintenance-custom-message').textContent = data.message;
                    }
                })
                .catch(error => console.error('Erro ao buscar mensagem de manutenção:', error));
        });
    </script>
    <!-- NOVO SCRIPT PARA VERIFICAR A RECUPERAÇÃO DA API -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusCheckInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/coc_status', { cache: 'no-store' });
                    if (response.ok) {
                        const data = await response.json();
                        // Se a API voltou, redireciona para o painel principal
                        if (data.status === 'ok') {
                            console.log('API está online. Redirecionando para o painel...');
                            window.location.href = '/painel';
                            clearInterval(statusCheckInterval); // Para de verificar após o redirecionamento
                        }
                    }
                } catch (error) {
                    // Continua tentando se houver um erro de rede
                    console.error('Erro ao verificar status da API para recuperação:', error);
                }
            }, 15000); // Verifica a cada 15 segundos
        });
    </script>
</body>
</html>
